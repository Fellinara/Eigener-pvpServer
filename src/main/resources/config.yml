# Risiko Plugin Konfiguration

# Standard-Herzen für reguläre Spieler
default-hearts: 1

# Herzen für Könige (König hat NUR diese Herzen, NICHT default-hearts + king-hearts)
king-hearts: 2

# Kampf-Tag Dauer in Sekunden
combat-tag-seconds: 30

# Wie lange das Kampf-Logout-Dummy stehen bleibt (Sekunden)
combat-logout-stand-seconds: 15

# Weltgrenze: Startgröße für das Finale (Durchmesser in Blöcken)
border-start-size: 2000.0

# Weltgrenze: Endgröße für das Finale
border-end-size: 100.0

# Dauer des Grenzschrumpfens in Sekunden (3600 = 1 Stunde)
border-shrink-time: 3600

# Spawn-Positionen für das Finale
spawn-fichten:
  world: world
  x: 0.5
  y: 64.0
  z: 200.5

spawn-dschungel:
  world: world
  x: 0.5
  y: 64.0
  z: -200.5

# Nachrichten (können angepasst werden)
messages:
  kingdom-fichten: "Fichten Königreich"
  kingdom-dschungel: "Dschungel Königreich"
  no-hearts-left: "Du hast alle deine Herzen verloren! Du wirst gebannt."
  ban-reason: "Du hast alle deine Herzen verloren!"
