name: Release

on:
  push:
    tags:
      - "v*"   # Triggered by tags like v1.0.0, v1.2.3, etc.
  workflow_dispatch:
    inputs:
      version:
        description: "Release-Version (z.B. v1.0.1) – wird als Tag und Release-Name verwendet"
        required: true
        type: string

permissions:
  contents: write   # Required to create a GitHub Release

jobs:
  release:
    name: Build & Release JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file KlassenPlugin/pom.xml

      - name: Determine release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Rename JAR to include version tag
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          mv KlassenPlugin/target/KlassenPlugin-*.jar \
             KlassenPlugin/target/KlassenPlugin-${VERSION}.jar

      - name: Download ProtocolLib for bundling
        run: |
          curl -L -o ProtocolLib.jar \
            "https://github.com/dmulloy2/ProtocolLib/releases/latest/download/ProtocolLib.jar"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: "KlassenPlugin ${{ steps.version.outputs.VERSION }}"
          body: |
            ## KlassenPlugin ${{ steps.version.outputs.VERSION }}

            ### Installation
            1. Lade **beide** Dateien unten herunter: `KlassenPlugin-${{ steps.version.outputs.VERSION }}.jar` **und** `ProtocolLib.jar`
            2. Kopiere **beide** JAR-Dateien in den `plugins/`-Ordner deines Paper-Servers
            3. Starte (oder lade) den Server neu

            > **Hinweis:** Falls du ProtocolLib noch nicht installiert hast, lädt das Plugin es beim ersten Start automatisch herunter – dann einfach den Server neu starten.

            ### Voraussetzungen
            - Paper 1.21.4 (oder neuer)
            - Java 21
          files: |
            KlassenPlugin/target/KlassenPlugin-${{ steps.version.outputs.VERSION }}.jar
            ProtocolLib.jar
          fail_on_unmatched_files: true
