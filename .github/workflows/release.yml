name: Build & Release ResourcePack

on:
  push:
    tags:
      - 'v*'          # runs on any tag like v1.0, v1.0.0, etc.
  workflow_dispatch:  # allow manual trigger from GitHub UI

jobs:
  release:
    name: Package and release ResourcePack
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to create releases and upload assets

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build VoidSword-ResourcePack.zip
        run: |
          cd ResourcePack
          zip -r ../VoidSword-ResourcePack.zip .
          echo "ZIP size: $(du -sh ../VoidSword-ResourcePack.zip | cut -f1)"

      - name: Create GitHub Release and upload ZIP
        uses: softprops/action-gh-release@v2
        with:
          name: Void Sword Resource Pack ${{ github.ref_name }}
          body: |
            ## ⚔️ Void Sword – Resource Pack ${{ github.ref_name }}

            Replaces the Diamond Sword with the **Void Sword**: dark obsidian blade with glowing purple crystals.

            ### 📥 Download & Installation
            1. Download **VoidSword-ResourcePack.zip** from the Assets section below
            2. Copy the ZIP (do **not** extract it) to your Minecraft resourcepacks folder:
               - **Windows:** `%AppData%\.minecraft\resourcepacks\`
               - **macOS:** `~/Library/Application Support/minecraft/resourcepacks/`
               - **Linux:** `~/.minecraft/resourcepacks/`
            3. Launch Minecraft → **Options → Resource Packs** → activate the pack
            4. Enjoy your new Void Sword! 🔮
          files: VoidSword-ResourcePack.zip
          draft: false
          prerelease: false
