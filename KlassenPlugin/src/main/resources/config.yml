# KlassenPlugin Konfiguration

# Plugin aktiviert/deaktiviert
plugin-enabled: true

# Maximale Anzahl an Homes pro Spieler (0 = unbegrenzt)
max-homes: 5

# Willkommensnachricht beim Betreten des Servers
join-message:
  enabled: true
  message: "&aWillkommen auf dem Server, &e{player}&a!"

# Teleport-Cooldown in Sekunden (0 = kein Cooldown)
teleport-cooldown: 3

# /back Einstellungen
back:
  # Position bei Tod speichern
  on-death: true

# /tpa Einstellungen
tpa:
  # Sekunden bis eine Anfrage abläuft
  expire-seconds: 60

# Nachrichten (Farben mit & möglich)
messages:
  prefix: "&8[&bKlassenPlugin&8] "
  lobby-teleported: "&aDu wurdest zur Lobby teleportiert!"
  lobby-set: "&aLobby wurde gesetzt!"
  lobby-not-set: "&cDie Lobby wurde noch nicht gesetzt! Benutze /setlobby"
  home-set: "&aHome &e{name} &awurde gesetzt!"
