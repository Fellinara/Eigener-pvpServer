# Scoreboard (Sidebar rechts im Spiel)
scoreboard:
  enabled: true
  # Titel des Scoreboards (&-Farbcodes erlaubt)
  title: "&6&lKlassenPlugin"
  # Zeilen von oben nach unten.
  # Platzhalter: {player} {rank} {balance} {online} {server}
  # Leere Zeilen werden als Trennlinie dargestellt.
  lines:
    - " "
    - "&7Server: &e{server}"
    - "&7Online: &e{online}"
    - " "
    - "&6&lEconomy"
    - "&7Geld: &6{balance}"
    - " "
    - "&7Rang: &f{rank}"
    - " "
    - "&8play.server.de"

# Anti-Cheat Einstellungen
anticheat:
  enabled: true
  # Benachrichtige Admins bei Verstößen (klassenplugin.anticheat.alert Berechtigung)
  alert-admins: true
  # Aktion bei zu vielen Verstößen: warn, kick, ban
  action: ban
  # Anzahl Verstöße bevor eine Aktion ausgeführt wird
  violations-before-action: 5

  xray:
    enabled: true
    # Anzahl überwachter Erze die in 'time-window' Sekunden abgebaut werden dürfen
    ore-threshold: 10
    # Zeitfenster in Sekunden
    time-window: 60
    # Überwachte Erze (Material-Namen)
    monitored-ores:
      - DIAMOND_ORE
      - DEEPSLATE_DIAMOND_ORE
      - EMERALD_ORE
      - DEEPSLATE_EMERALD_ORE
      - ANCIENT_DEBRIS
      - GOLD_ORE
      - DEEPSLATE_GOLD_ORE

  speed:
    enabled: true
    # Maximale Blöcke pro Sekunde (Sprinten ~7.1, Speed I ~10, Speed II ~12.5)
    max-blocks-per-second: 16.0
    # Speed-Potion-Bonus pro Verstärkungsstufe (in Blöcken pro Sekunde)
    speed-potion-bonus-per-level: 3.5

  fly:
    enabled: true
    # Ticks in der Luft bevor ein Verstoß – niedrigerer Wert = aggressiver
    max-air-ticks: 80

  reach:
    enabled: true
    # Maximale Angriffsreichweite in Blöcken (normal: 3.0, mit Hitbox: ~4.0)
    max-reach: 5.0

  killaura:
    enabled: true
    # Maximale Treffer pro Sekunde
    max-hits-per-second: 12

  scaffold:
    enabled: true
    max-blocks-per-second: 8

  nofall:
    enabled: true

  # Erkennt Spieler, die durch solide Blöcke laufen (Phase/NoClip)
  phase:
    enabled: true

  # Erkennt Spieler, die auf Wasser laufen (Jesus-Hack)
  jesus:
    enabled: true

  # Erkennt unmögliche Positionssprünge (Teleport-Hack)
  teleport:
    enabled: true
    # Maximale Distanz die ein Spieler in einem Tick zurücklegen kann (in Blöcken)
    max-distance: 20.0

  # ProtocolLib-Paket-Checks (nur aktiv wenn ProtocolLib installiert ist)
  packet:
    # Erkennt unmögliche Bewegungsdistanzen direkt auf Paketebene
    packetmove:
      enabled: true
      # Maximale Distanz pro Paket in Blöcken (verhindert Teleport-Hacks)
      max-distance: 10.0

    # Erkennt Spieler, die zu viele Pakete pro Sekunde senden (Bot/Exploit)
    packetflood:
      enabled: true
      # Maximale Pakete pro Sekunde
      max-per-second: 200

    # Erkennt FreeCam: Spieler sendet keine Bewegungspakete aber ist aktiv
    freecam:
      enabled: true
      # Sekunden ohne Bewegungspaket bei gleichzeitiger Aktivität = FreeCam-Verdacht
      idle-seconds: 8

    # Prüft Entfernungen bei Entitäts-Interaktions-Paketen (Reach-Hack)
    packetreach:
      enabled: true
      # Maximale Reichweite in Blöcken
      max-reach: 6.0

    # Prüft Entfernungen bei Block-Abbau-Paketen
    packetdig:
      enabled: true
      # Maximale Reichweite in Blöcken
      max-reach: 7.0

  # Hack-Client-Erkennung via Client-Brand und Plugin-Kanal-Registrierung
  # (Erfordert ProtocolLib – wird automatisch aktiviert wenn ProtocolLib verfügbar ist)
  hack-client:
    enabled: true
    # Aktion bei Erkennung: "kick" oder "ban"
    action: kick
    # Kick-Nachricht (& Farbcodes; {client} wird durch den erkannten Client ersetzt)
    kick-message: "&c&lHack-Client erkannt!\n\n&7Dein Client ist auf diesem Server nicht erlaubt.\n&eDu verwendest: &c{client}"
    # Client-Brands, die geblockt werden (Kleinschreibung; Teilstring-Suche)
    blocked-brands:
      - "wurst"
      - "meteor-client"
      - "meteor"
      - "impact"
      - "aristois"
      - "sigma"
      - "liquidbounce"
      - "rise"
      - "hacked"
      - "future"
      - "inertia"
      - "rusherhack"
      - "novoline"
      - "wolfram"
      - "zeroday"
      - "xray"
      - "killaura"
    # Plugin-Kanal-Präfixe, die von Hack-Clients registriert werden
    blocked-channels:
      - "wurst:"
      - "meteor-client:"
      - "impact:"
      - "aristois:"
      - "sigma:"
      - "liquidbounce:"
      - "inertia:"
      - "rusherhack:"

# Rang-System
ranks:
  # Standardrang für neue Spieler (leer = kein Standardrang)
  default-rank: ""

# Wirtschaft (Economy)
economy:
  currency-name: "Coins"
  starting-balance: 500.0
  inflation:
    target-balance-per-player: 1000.0

# Auktionshaus
auction:
  max-listings-per-player: 10
  # Dauer eines Angebots in Stunden (danach wird es automatisch entfernt)
  listing-duration-hours: 24

# Wöchentlicher Changelog
changelog:
  week-duration-hours: 168
  boosts-per-week: 4
  min-boost: 1.3
  max-boost: 2.5

# Bündnis-System
alliance:
  protect-pvp: true

# ClearLag – automatische Lag-Bereinigung
clearlag:
  enabled: true
  # Intervall zwischen Bereinigungen in Minuten
  interval-minutes: 30
  # Warnung X Minuten/Sekunden vor der Bereinigung (komma-separierte Sekunden)
  warnings-before-seconds:
    - 300   # 5 Minuten
    - 60    # 1 Minute
    - 30    # 30 Sekunden
    - 10    # 10 Sekunden
  # Mindestabstand zur Bereinigung (in Chunks) – Entities näher dran werden verschont
  safe-radius-chunks: 3
  # Welche Entity-Typen werden entfernt (neben Items)
  remove-mobs: true
  # Entities nahe Spielern auch entfernen?
  protect-near-players: true

# Wartungsmodus
maintenance:
  enabled: false
  # Nachricht die beim Verbinden während Wartung gezeigt wird
  kick-message: |
    &8▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀

      &e&l⚙ WARTUNGSARBEITEN ⚙

      &7Der Server befindet sich gerade in
      &7der Wartung. Bitte versuche es
      &7später erneut.

      &8▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄▄

